name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Placeholder values with the right shape: builds, type checks and smoke tests
# must not need real secrets. `prisma generate` / `validate` only need
# DATABASE_URL to be present, and `next build` does not run startup validation.
env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cupform
  NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci.anon.key
  SUPABASE_SERVICE_ROLE_KEY: ci.service.key
  STRIPE_SECRET_KEY: sk_test_ci
  STRIPE_WEBHOOK_SECRET: whsec_ci
  STRIPE_PRICE_ID_MONTHLY: price_ci_monthly
  STRIPE_PRICE_ID_ANNUAL: price_ci_annual
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  # Migrations are append-only history: lint them for destructive or
  # row-breaking changes without needing a database.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check:migrations

  prisma-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run prisma:generate

  # Applies the versioned migrations to a throwaway Postgres, runs the same
  # integrity checks as `npm run check:db` (tables present, migrations applied,
  # no drift from schema.prisma), then the API integration tests - which include
  # a populated-database migration run that proves no rows are lost.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cupform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run check:db
      # Real routers against the real schema as two users: ownership,
      # validation and cascade deletes (Phase 1), plan limits, audit log,
      # webhook idempotency and migration data safety (Phase 3).
      - run: npm run test:integration

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build

  # Boots the production server and checks route wiring: auth guards redirect,
  # the webhook rejects unsigned requests, protected tRPC returns 401.
  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Start server
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/login && exit 0
            sleep 1
          done
          cat server.log; exit 1
      - run: npm run check:smoke
      - if: failure()
        run: cat server.log
